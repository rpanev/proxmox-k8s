---
# Self-contained OS check — safe via include_role tasks_from: validate-os

- name: Check release-file paths
  ansible.builtin.stat:
    path: "{{ item }}"
  register: release_path_stats
  loop:
    - /etc/lsb-release
    - /etc/redhat-release
    - /etc/centos-release

# - name: Remove bogus release-file directories
#   ansible.builtin.file:
#     path: "{{ item.item }}"
#     state: absent
#   loop: "{{ release_path_stats.results }}"
#   when:
#     - item.stat.exists | default(false)
#     - item.stat.isdir | default(false)

- name: Gather OS facts
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - min
      - distribution

- name: Backfill OS facts from LSB when package manager or distribution is missing
  ansible.builtin.set_fact:
    ansible_distribution: "{{ ansible_lsb.id }}"
    ansible_distribution_major_version: "{{ ansible_lsb.major_release | string }}"
    ansible_os_family: >-
      {{
        'Debian' if ansible_lsb.id in ['Debian', 'Ubuntu']
        else 'RedHat' if ansible_lsb.id in ['AlmaLinux', 'Rocky', 'Rocky Linux', 'CentOS', 'RedHat', 'Fedora']
        else 'Unknown'
      }}
    ansible_pkg_mgr: >-
      {{
        'apt' if ansible_lsb.id in ['Debian', 'Ubuntu']
        else 'dnf' if ansible_lsb.id in ['AlmaLinux', 'Rocky', 'Rocky Linux', 'CentOS', 'Fedora']
        else 'unknown'
      }}
  when:
    - ansible_lsb is defined
    - ansible_lsb.id is defined
    - ansible_pkg_mgr is not defined or ansible_os_family is not defined or ansible_distribution is not defined

- name: Validate supported OS
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['RedHat', 'Debian']
      - >
        (ansible_distribution == 'Debian' and ansible_distribution_major_version == '13')
        or (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version in ['24', '26'])
        or (ansible_distribution == 'AlmaLinux' and ansible_distribution_major_version == '10')
        or (ansible_distribution in ['Rocky', 'Rocky Linux'] and ansible_distribution_major_version == '10')
    fail_msg: >-
      Unsupported OS: {{ ansible_distribution | default('unknown') }}
      {{ ansible_distribution_major_version | default('') }}.
      Supported: Debian 13, Ubuntu 24/26, AlmaLinux 10, Rocky Linux 10.
