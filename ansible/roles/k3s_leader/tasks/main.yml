---
- name: Validate supported OS
  ansible.builtin.include_role:
    name: common
    tasks_from: validate-os

- name: Build TLS SAN list for K3s API certificate
  ansible.builtin.set_fact:
    k3s_tls_sans: >-
      {{
        (
          [ansible_host, k3s_lb_ip | default(ansible_host)]
          + (groups['k3s_first_leader'] | default([]) | map('extract', hostvars, 'ansible_host') | list)
          + (groups['k3s_additional_leaders'] | default([]) | map('extract', hostvars, 'ansible_host') | list)
          + (k3s_extra_tls_sans | default([]))
        ) | unique | list
      }}

- name: Ensure K3s config directory exists
  ansible.builtin.file:
    path: "{{ k3s_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy K3s server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_config_path }}"
    owner: root
    group: root
    mode: "0600"
  register: k3s_server_config
  notify: Restart k3s

- name: Check if K3s server is running
  ansible.builtin.command: systemctl is-active {{ k3s_service }}
  register: k3s_service_state
  changed_when: false
  failed_when: false

- name: Install K3s server
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      K3S_TOKEN="{{ k3s_token }}" \
      INSTALL_K3S_EXEC="server --config {{ k3s_config_path }}" \
      sh -
  args:
    executable: /bin/bash
  when: k3s_service_state.stdout != 'active'
  register: k3s_install
  changed_when: k3s_install.rc == 0

- name: Rotate K3s certificates after config change
  ansible.builtin.command: k3s certificate rotate
  when:
    - k3s_server_config is changed
    - k3s_service_state.stdout == 'active'
  notify: Restart k3s

- name: Apply K3s certificate rotation
  ansible.builtin.meta: flush_handlers

- name: Ensure K3s server is enabled and running
  ansible.builtin.service:
    name: "{{ k3s_service }}"
    state: started
    enabled: true

- name: Wait for K3s API on this node
  ansible.builtin.wait_for:
    port: "{{ k3s_api_port }}"
    host: 127.0.0.1
    timeout: 300

- name: Ensure kubeconfig directory exists
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install kubeconfig for root
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: "0600"
