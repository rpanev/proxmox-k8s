[defaults]
# Inventory is always passed via -i inventories/<ENV_ID>/hosts.yml (deploy-infra.sh)
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
facts_modules = ansible.builtin.setup
timeout = 60
forks = 10

[ssh_connection]
pipelining = True
retries = 5

[privilege_escalation]
become = True
become_method = sudo
