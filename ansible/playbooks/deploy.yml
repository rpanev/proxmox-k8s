---
# K3s cluster bootstrap — homelab
# Order: wait SSH → common baseline → masters → HAProxy → workers (workers join via LB IP)
# Run: ansible-playbook playbooks/deploy.yml -i inventories/<ENV_ID>/hosts.yml

- import_playbook: wait-for-ssh.yml
  vars:
    wait_for_ssh_hosts: k8s_lb:k3s_first_leader:k3s_additional_leaders:k3s_workers
    wait_for_ssh_timeout: 1200
    wait_for_ssh_delay: 10

- name: Common host baseline
  hosts: k8s_lb:k3s_first_leader:k3s_additional_leaders:k3s_workers
  gather_facts: true
  roles:
    - role: common

- name: K3s node prerequisites
  hosts: k3s_first_leader:k3s_additional_leaders:k3s_workers
  gather_facts: true
  roles:
    - role: k3s_prereqs

- name: First K3s control plane (cluster-init)
  hosts: k3s_first_leader
  gather_facts: true
  roles:
    - role: k3s_leader
      vars:
        k3s_leader_mode: first

- name: Additional K3s control planes
  hosts: k3s_additional_leaders
  gather_facts: true
  serial: 1
  roles:
    - role: k3s_leader
      vars:
        k3s_leader_mode: additional

- name: HAProxy API load balancer (after K3s API is up on masters)
  hosts: k8s_lb
  gather_facts: true
  roles:
    - role: haproxy
      vars:
        haproxy_backend_health_check: true
    # node_exporter so the LB VM (not a K8s node) shows in Grafana Node Exporter Full
    - role: node_exporter

- name: K3s worker agents (join via load balancer)
  hosts: k3s_workers
  gather_facts: true
  serial: 1
  roles:
    - role: k3s_worker

- name: Longhorn dedicated data disk (workers only)
  hosts: k3s_workers
  gather_facts: true
  roles:
    - role: longhorn_disk

- name: Tailscale Kubernetes Operator (cluster pods only — runs on deploy host)
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: tailscale_operator
