# Argo CD — Tailscale Ingress when enabled; Gateway HTTPRoute is applied separately.
# Hostname is set at deploy via --set server.ingress.hostname.
configs:
  params:
    # Tailscale Ingress terminates TLS; backend speaks HTTP on port 80
    server.insecure: "true"

server:
  replicas: 1
  ingress:
    enabled: true
    ingressClassName: tailscale
    path: /
    pathType: Prefix
    tls: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

controller:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

notifications:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

redis:
  enabled: true
