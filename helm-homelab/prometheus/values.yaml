# kube-prometheus-stack — homelab (nodes + cluster metrics)
# alertmanager.enabled + grafana.adminPassword set at deploy from secrets.env

alertmanager:
  enabled: false

prometheus:
  ingress:
    enabled: false
  prometheusSpec:
    retention: 15d
    retentionSize: 8GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  ingress:
    enabled: false
  # kube-prometheus-stack built-in K8s dashboards (General folder) — keep Homelab gnetId only
  defaultDashboardsEnabled: false
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true
  # Community dashboards imported from grafana.com (init container downloads JSON).
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: homelab
          orgId: 1
          folder: Homelab
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/homelab
  dashboards:
    homelab:
      # Kubernetes / Views / Global — cluster overview (dotdc, kube-state-metrics + node-exporter)
      k8s-views-global:
        gnetId: 15757
        revision: 43
        datasource: Prometheus
      # Kubernetes / Views / Pods
      k8s-views-pods:
        gnetId: 15760
        revision: 39
        datasource: Prometheus
      # Node Exporter Full — per-node hardware/OS metrics
      node-exporter-full:
        gnetId: 1860
        revision: 45
        datasource: Prometheus
      # cert-manager — needs cert-manager ServiceMonitor (enabled in cert-manager values)
      cert-manager:
        gnetId: 11001
        revision: 1
        datasource: Prometheus
      # Argo CD operational overview — needs argocd ServiceMonitors (enabled in argocd values)
      argocd:
        gnetId: 19993
        revision: 7
        datasource: Prometheus
      # HAProxy — fed by the LB VM's native exporter (additionalScrapeConfigs, deploy-injected)
      haproxy:
        gnetId: 12693
        revision: 14
        datasource: Prometheus
      # Tailscale overview — fed by tailscale-exporter (TAILSCALE_EXPORTER_ENABLED)
      tailscale:
        gnetId: 24177
        revision: 5
        datasource: Prometheus
      # Server logs — Loki dashboard 24574 (needs instance/service_name/container_name labels)
      logging-loki-v3:
        gnetId: 24574
        revision: 2
        datasource: Loki
      # Trivy Operator vulnerabilities — needs TRIVY_OPERATOR_ENABLED + ServiceMonitor
      trivy-operator:
        gnetId: 16337
        revision: 16
        datasource: Prometheus
      # Velero (23838) / Kasten (21065): added at deploy via write_backup_grafana_dashboard_values

# Node metrics — DaemonSet on every node (workers + control plane)
nodeExporter:
  enabled: true
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule

kubeStateMetrics:
  enabled: true

# K3s does not expose these components like kubeadm — skip noisy scrape failures
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

defaultRules:
  create: true
  rules:
    alertmanager: false

prometheusOperator:
  enabled: true
  # Operator TLS mounts admission secret; disable both when webhooks are off.
  tls:
    enabled: false
  # Pre-install patch Jobs hammer etcd on fresh clusters (esp. right after Longhorn CRDs).
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
